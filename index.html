<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimoe Koharu</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #ff8f8f;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
        }

        @keyframes jump {
            0%   { transform: translateY(0); }
            30%  { transform: translateY(-30px); }
            55%  { transform: translateY(0); }
            75%  { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }

        img.jump {
            animation: jump 0.4s ease-out;
        }

        @keyframes shake {
            0%   { transform: translateX(0); }
            15%  { transform: translateX(-15px); }
            30%  { transform: translateX(12px); }
            45%  { transform: translateX(-10px); }
            60%  { transform: translateX(8px); }
            75%  { transform: translateX(-5px); }
            90%  { transform: translateX(3px); }
            100% { transform: translateX(0); }
        }

        img.shake {
            animation: shake 0.5s ease-out;
        }
    </style>
</head>
<body>
    <img id="sprite" src="img/koharu_spr_1.png" alt="Koharu">

    <audio id="clickSound" src="sound/Koharu_Formation_Select.mp3" preload="auto"></audio>
    <audio id="rareSound" src="sound/Koharu_Battle_Damage_3.ogg" preload="auto"></audio>

    <script>
        const sprite = document.getElementById('sprite');
        const clickSound = document.getElementById('clickSound');
        const rareSound = document.getElementById('rareSound');

        const SPRITE_DEFAULT = 'img/koharu_spr_1.png';
        const SPRITE_CLICK_1 = 'img/koharu_spr_2.png';
        const SPRITE_CLICK_2 = 'img/koharu_spr_3.png';
        const SPRITE_RARE = 'img/koharu_spr_4.png';

        const RARE_CHANCE = 0.05;

        sprite.addEventListener('click', () => {

            if (Math.random() < RARE_CHANCE) {
                playRarePattern();
            } else {
                playNormalPattern();
            }
        });

        function playNormalPattern() {
            clickSound.currentTime = 0;
            clickSound.play().catch(() => {});

            sprite.classList.remove('jump', 'shake');
            void sprite.offsetWidth;
            sprite.classList.add('jump');

            sprite.src = SPRITE_CLICK_1;

            setTimeout(() => {
                sprite.src = SPRITE_CLICK_2;
                const randomDelay = (500 + Math.random() * 1500);
                setTimeout(() => {
                    sprite.src = SPRITE_DEFAULT;
                }, randomDelay);
            }, 200);
        }

        function playRarePattern() {
            rareSound.currentTime = 0;
            rareSound.play().catch(() => {});

            sprite.classList.remove('jump', 'shake');
            void sprite.offsetWidth;
            sprite.classList.add('shake');
            sprite.src = SPRITE_RARE;
            const randomDelay = (1 + Math.random() * 2) * 1000;
            setTimeout(() => {
                sprite.src = SPRITE_DEFAULT;
            }, randomDelay);
        }

        sprite.addEventListener('animationend', () => {
            sprite.classList.remove('jump', 'shake');
        });
    </script>
</body>
</html>
